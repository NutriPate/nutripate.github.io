<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оплата NutriPate</title>
  <style>
    body { margin: 0; background: #f6f4ef; color: #1d1a17; font-family: Montserrat, Arial, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 48px 20px; }
    a, button { display: inline-block; margin: 8px 8px 0 0; background: #1f6f5b; color: white; text-decoration: none; border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; }
    .ghost { background: transparent; color: #1f6f5b; }
  </style>
</head>
<body>
  <main>
    <h1>Платёж отправлен</h1>
    <p>Если оплата прошла, PRO привяжется к почте из чека. Войдите в приложение или на сайт с этим адресом — срок подтянется сам. Повторное уведомление от банка срок не удлиняет.</p>
    <p id="app-back" hidden><a id="open-app" href="nutripate://payment/success">Вернуться в приложение</a></p>
    <p><a class="ghost" href="/webversion/">Открыть веб-приложение</a></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const app = document.getElementById('app-back');
    const link = document.getElementById('open-app');
    if (params.get('is_app') === '1') app.hidden = false;
    if (params.get('payment_id')) link.href = 'nutripate://payment/success?payment_id=' + encodeURIComponent(params.get('payment_id'));
  </script>
</body>
</html>
