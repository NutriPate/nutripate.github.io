<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NutriPate — магазины 4 Лапы</title>
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf5f0;font-family:Arial,sans-serif;color:#092f32}#map{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none}#map.dragging{cursor:grabbing}.layer{position:absolute;will-change:transform;pointer-events:none}.tile,.marker{position:absolute;pointer-events:none}.tile{width:256px;height:256px}.marker{width:18px;height:18px;border-radius:50%;background:#11aeb0;border:2px solid #fff;box-shadow:0 1px 4px #174c4c88;color:#fff;text-align:center;font-size:9px;line-height:14px;font-weight:700}.cluster{width:27px;height:27px;line-height:23px;background:#087f82}.ui{position:fixed;left:16px;bottom:16px;z-index:5;display:flex;gap:8px;align-items:center}.ui button,.count{height:36px;border:1px solid #dce5de;border-radius:10px;background:#fff;color:#092f32;box-shadow:0 2px 8px #174c4c33}.ui button{width:40px;font-size:20px}.count{padding:10px 12px;font-size:12px}.credit{position:fixed;right:10px;bottom:8px;z-index:5;font-size:11px;background:#fff9;padding:3px 5px;border-radius:5px}
</style>
</head>
<body><div id="map"><div id="layer" class="layer"></div></div><div class="ui"><button id="minus">−</button><button id="plus">+</button><span id="count" class="count">Загрузка…</span></div><div class="credit">© OpenStreetMap contributors © CARTO</div>
<script>
const map=document.getElementById('map'),layer=document.getElementById('layer'),T=256;let z=5,center=[55.75,37.62],points=[],drag=null,frame=0;const cache=new Map();
const xy=(lon,lat)=>{const s=T*2**z,r=Math.sin(lat*Math.PI/180);return[(lon+180)/360*s,(.5-Math.log((1+r)/(1-r))/(4*Math.PI))*s]};
const ll=(x,y)=>{const s=T*2**z,n=Math.PI-2*Math.PI*Math.max(0,Math.min(s,y))/s;return[180/Math.PI*Math.atan(Math.sinh(n)),x%s/s*360-180]};
const ru=p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)&&+p.lat>=41&&+p.lat<=82&&+p.lon>=19&&+p.lon<=180;
const tile=(x,y)=>`https://a.basemaps.cartocdn.com/rastertiles/voyager/${z}/${x}/${y}.png`;
function render(){const q=xy(center[1],center[0]),W=map.clientWidth,H=map.clientHeight,cols=Math.ceil(W/T)+2,rows=Math.ceil(H/T)+2,fx=Math.floor(q[0]/T)-Math.floor(cols/2),fy=Math.floor(q[1]/T)-Math.floor(rows/2),frag=document.createDocumentFragment(),visible=new Set();layer.style.width=cols*T+'px';layer.style.height=rows*T+'px';for(let y=fy;y<fy+rows;y++)for(let x=fx;x<fx+cols;x++){const n=2**z,key=`${z}/${x}/${y}`,k=((x%n)+n)%n,ky=Math.max(0,Math.min(n-1,y));let im=cache.get(key);if(!im){im=new Image();im.className='tile';im.decoding='async';im.src=tile(k,ky);cache.set(key,im)}im.style.left=(x-fx)*T+'px';im.style.top=(y-fy)*T+'px';frag.appendChild(im);visible.add(key)}layer.style.transform=`translate3d(${W/2-(q[0]-fx*T)}px,${H/2-(q[1]-fy*T)}px,0)`;while(layer.firstChild)layer.removeChild(layer.firstChild);layer.appendChild(frag);const cell=z<8?34:22,g=new Map();for(const p of points){const a=xy(+p.lon,+p.lat),sx=a[0]-fx*T,sy=a[1]-fy*T;if(sx<-30||sy<-30||sx>cols*T+30||sy>rows*T+30)continue;const key=Math.floor(sx/cell)+','+Math.floor(sy/cell);(g.get(key)||g.set(key,[]).get(key)).push([sx,sy])}const marks=document.createDocumentFragment();for(const a of g.values()){const x=a.reduce((s,p)=>s+p[0],0)/a.length,y=a.reduce((s,p)=>s+p[1],0)/a.length,d=document.createElement('div');d.className='marker'+(a.length>1?' cluster':'');if(a.length>1)d.textContent=a.length;d.style.left=(x-(a.length>1?13:9))+'px';d.style.top=(y-(a.length>1?13:9))+'px';marks.appendChild(d)}layer.appendChild(marks);document.getElementById('count').textContent=points.length+' магазинов в России';}
function fit(){if(!points.length)return;const xs=points.map(p=>+p.lon),ys=points.map(p=>+p.lat);center=[(Math.min(...ys)+Math.max(...ys))/2,(Math.min(...xs)+Math.max(...xs))/2];for(let n=8;n>=3;n--){z=n;const dx=(Math.max(...xs)-Math.min(...xs))/360*T*2**z,dy=(Math.max(...ys)-Math.min(...ys))/180*T*2**z;if(dx<innerWidth*.78&&dy<innerHeight*.78)break}}
function move(x,y){if(!drag)return;drag.dx=x-drag.x;drag.dy=y-drag.y;if(frame)return;frame=requestAnimationFrame(()=>{frame=0;center=ll(drag.world[0]-drag.dx,drag.world[1]-drag.dy);render()})}
map.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={x:e.clientX,y:e.clientY,world:xy(center[1],center[0]),dx:0,dy:0};map.classList.add('dragging');map.setPointerCapture?.(e.pointerId);e.preventDefault()};map.onpointermove=e=>move(e.clientX,e.clientY);map.onpointerup=()=>{drag=null;map.classList.remove('dragging');render()};map.onwheel=e=>{e.preventDefault();z=Math.max(3,Math.min(18,z+(e.deltaY<0?1:-1)));render()};document.getElementById('plus').onclick=()=>{z=Math.min(18,z+1);render()};document.getElementById('minus').onclick=()=>{z=Math.max(3,z-1);render()};
const cachedStores=(()=>{try{return JSON.parse(localStorage.getItem('nutripate-russia-stores')||'[]')}catch(_e){return[]}})();
if(cachedStores.length){points=cachedStores.filter(ru);fit();render()}
fetch('../map-stores.json?v=20261123',{cache:'no-store'}).then(r=>r.json()).then(x=>{const fresh=(x.stores||[]).filter(ru);localStorage.setItem('nutripate-russia-stores',JSON.stringify(fresh));points=fresh;fit();render()}).catch(()=>{if(!cachedStores.length)document.getElementById('count').textContent='Не удалось загрузить магазины'})
</script></body></html>
