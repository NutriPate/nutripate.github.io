<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/nutripate-icon.jpg">
    <link rel="stylesheet" href="iphone-app.css?v=responsive-parity9-paw-icon">
  <title>NutriPate · приложение</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="app-logo" href="#today" aria-label="NutriPate"><span class="logo-nutri">Nutri</span><span>Pate</span></a>
      <button class="pet-switcher" id="petSwitcher" type="button" aria-label="Выбрать питомца"><span id="petAvatar" class="pet-avatar-placeholder" aria-hidden="true"></span><span id="petName">Питомец</span><span class="chevron">⌄</span></button>
    </header>
    <main id="appMain" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button data-tab="today" class="nav-item active" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.8 10.4 12 3l9.2 7.4v9.1H2.8z"/><path d="M9.4 19.5v-5.2h5.2v5.2"/></svg></span><span>Сегодня</span></button>
      <button data-tab="foods" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1.4"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><span>Корма</span></button>
      <button data-tab="diary" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 4v5l3-1.7L15 9V4M9 14h6M9 17h4"/></svg></span><span>Дневник</span></button>
      <button data-tab="pets" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7.2" cy="7.5" r="1.55"/><circle cx="10.4" cy="5.4" r="1.55"/><circle cx="13.8" cy="5.4" r="1.55"/><circle cx="16.9" cy="7.5" r="1.55"/><path d="M12 10.1c-2.7 0-4.9 1.8-4.9 4.2 0 1.8 1.3 2.8 2.9 2.8.8 0 1.5-.3 2-.8.5.5 1.2.8 2 .8 1.6 0 2.9-1 2.9-2.8 0-2.4-2.2-4.2-4.9-4.2Z"/></svg></span><span>Питомцы</span></button>
      <button data-tab="more" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/></svg></span><span>Прочее</span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="iphone-app.js?v=responsive-parity9-paw-icon" defer></script>
</body>
</html>
