<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/nutripate-icon.jpg">
    <link rel="stylesheet" href="iphone-app.css?v=food-actions2">
  <title>NutriPate · приложение</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="app-logo" href="#today" aria-label="NutriPate"><span class="logo-nutri">Nutri</span><span>Pate</span></a>
      <button class="pet-switcher" id="petSwitcher" type="button" aria-label="Выбрать питомца"><span id="petAvatar">🐈</span><span id="petName">Питомец</span><span class="chevron">⌄</span></button>
    </header>
    <main id="appMain" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button data-tab="today" class="nav-item active" type="button"><span class="nav-icon">⌂</span><span>Сегодня</span></button>
      <button data-tab="foods" class="nav-item" type="button"><span class="nav-icon">▤</span><span>Корма</span></button>
      <button data-tab="diary" class="nav-item" type="button"><span class="nav-icon">▥</span><span>Дневник</span></button>
      <button data-tab="pets" class="nav-item" type="button"><span class="nav-icon">♧</span><span>Питомцы</span></button>
      <button data-tab="more" class="nav-item" type="button"><span class="nav-icon">•••</span><span>Прочее</span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="iphone-app.js?v=food-actions2" defer></script>
</body>
</html>
