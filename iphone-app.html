<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/nutripate-icon.jpg">
    <link rel="stylesheet" href="iphone-app.css?v=responsive-parity4-icons">
  <title>NutriPate · приложение</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="app-logo" href="#today" aria-label="NutriPate"><span class="logo-nutri">Nutri</span><span>Pate</span></a>
      <button class="pet-switcher" id="petSwitcher" type="button" aria-label="Выбрать питомца"><span id="petAvatar" class="pet-avatar-placeholder" aria-hidden="true"></span><span id="petName">Питомец</span><span class="chevron">⌄</span></button>
    </header>
    <main id="appMain" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Разделы приложения">
      <button data-tab="today" class="nav-item active" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.8l8.5 6.7v9.2H3.5z"/><path d="M9.2 19.7v-5.1h5.6v5.1"/></svg></span><span>Сегодня</span></button>
      <button data-tab="foods" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><span>Корма</span></button>
      <button data-tab="diary" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4.5h12v15H6z"/><path d="M9 4.5v5l3-1.8 3 1.8v-5M9 14h6M9 17h4"/></svg></span><span>Дневник</span></button>
      <button data-tab="pets" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="1.8"/><circle cx="16" cy="7" r="1.8"/><circle cx="5.7" cy="11" r="1.7"/><circle cx="18.3" cy="11" r="1.7"/><path d="M12 11.2c-3.3 0-6 2.1-6 4.7 0 2 1.4 3.1 3.1 3.1 1.1 0 1.9-.6 2.9-.6s1.8.6 2.9.6c1.7 0 3.1-1.1 3.1-3.1 0-2.6-2.7-4.7-6-4.7Z"/></svg></span><span>Питомцы</span></button>
      <button data-tab="more" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg></span><span>Прочее</span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="iphone-app.js?v=responsive-parity4-icons" defer></script>
</body>
</html>
