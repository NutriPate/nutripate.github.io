<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NutriPate — магазины 4 Лапы</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf5f0;font-family:Arial,sans-serif}#map{position:fixed;inset:0}.status{position:fixed;z-index:1000;left:16px;bottom:16px;padding:10px 12px;border:1px solid #dce5de;border-radius:10px;background:#fff;color:#092f32;box-shadow:0 2px 8px #174c4c33;font-size:12px}.leaflet-container{cursor:grab}.leaflet-container:active{cursor:grabbing}</style>
</head>
<body><div id="map"></div><div id="status" class="status">Загрузка магазинов…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const RUSSIA={minLat:41,maxLat:82,minLon:19,maxLon:180};
const isRussia=p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)&&+p.lat>=RUSSIA.minLat&&+p.lat<=RUSSIA.maxLat&&+p.lon>=RUSSIA.minLon&&+p.lon<=RUSSIA.maxLon;
const map=L.map('map',{preferCanvas:true,zoomControl:true,worldCopyJump:false,zoomAnimation:true,fadeAnimation:true}).setView([55.75,37.62],5);
L.tileLayer('https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,keepBuffer:1,attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map);
const groups=L.markerClusterGroup({chunkedLoading:true,chunkInterval:50,chunkDelay:20,animate:false,removeOutsideVisibleBounds:true,maxClusterRadius:52,disableClusteringAtZoom:12,showCoverageOnHover:false});
map.addLayer(groups);
fetch('/map-stores.json?v=20261123',{cache:'no-store'}).then(r=>r.json()).then(data=>{const stores=(data.stores||[]).filter(isRussia);const bounds=[];for(const p of stores){const marker=L.circleMarker([+p.lat,+p.lon],{radius:6,weight:2,color:'#fff',fillColor:'#0aaeb0',fillOpacity:.95});marker.bindTooltip('4 Лапы',{direction:'top',offset:[0,-5]});groups.addLayer(marker);bounds.push([+p.lat,+p.lon])}if(bounds.length){map.fitBounds(bounds,{padding:[40,40],maxZoom:6})}document.getElementById('status').textContent=`${stores.length} магазинов в России`}).catch(()=>{document.getElementById('status').textContent='Не удалось загрузить магазины'});
</script></body></html>
