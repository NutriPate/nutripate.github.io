<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Магазины 4 Лапы</title>
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font:14px Arial,sans-serif;color:#092f32;background:#eaf5f0}
    #map{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none}.layer{position:absolute;will-change:transform;pointer-events:none}.tile{position:absolute;width:256px;height:256px;background:#eaf5f0;object-fit:cover}.marker{position:absolute;pointer-events:auto;width:20px;height:20px;border:2px solid #fff;border-radius:50%;background:#13b5b5;box-shadow:0 1px 5px #174c4c88;color:#fff;font-size:9px;font-weight:700;line-height:16px;text-align:center;cursor:pointer}.marker.cluster{width:28px;height:28px;line-height:24px;background:#087f82}.ui{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:5}.ui button,.count,.selected{border:1px solid #dce5de;background:#fff;color:#092f32;box-shadow:0 2px 8px #174c4c33;border-radius:10px}.ui button{width:40px;height:38px;font-size:20px;cursor:pointer}.count{padding:11px 13px;font-size:12px}.selected{position:fixed;left:16px;right:16px;bottom:70px;max-width:520px;padding:10px 12px;display:none;z-index:5}.selected.show{display:block}.selected b{display:block;margin-bottom:3px}.credit{position:fixed;right:10px;bottom:8px;z-index:5;padding:3px 5px;background:#fff9;border-radius:5px;font-size:11px}@media(max-width:600px){.ui{left:10px;bottom:max(10px,env(safe-area-inset-bottom));gap:6px}.ui button{width:44px;height:40px}.count{font-size:11px;padding:12px 10px}.credit{font-size:9px;bottom:max(62px,calc(env(safe-area-inset-bottom) + 48px))}.selected{left:10px;right:10px;bottom:62px}}
  </style>
</head>
<body>
  <div id="map"><div id="layer" class="layer"></div></div>
  <div id="selected" class="selected" role="status"></div>
  <div class="ui"><button id="minus" aria-label="Отдалить">−</button><button id="plus" aria-label="Приблизить">+</button><span id="count" class="count">Загрузка магазинов…</span></div>
  <div class="credit">© OpenStreetMap contributors</div>
  <script>
  (()=>{
    const map=document.getElementById('map'),layer=document.getElementById('layer'),selected=document.getElementById('selected'),count=document.getElementById('count'),T=256;
    let zoom=5,center=[55.75,37.62],points=[],drag=null,raf=0,tx=0,ty=0,originX=0,originY=0;const cache=new Map();
    const world=(lon,lat)=>{const s=T*2**zoom,r=Math.sin(lat*Math.PI/180);return[(lon+180)/360*s,(.5-Math.log((1+r)/(1-r))/(4*Math.PI))*s]};
    const lngLat=(x,y)=>{const s=T*2**zoom,n=Math.PI-2*Math.PI*Math.max(0,Math.min(s,y))/s;return[180/Math.PI*Math.atan(Math.sinh(n)),x/s*360-180]};
    const isRussia=p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)&&+p.lat>=41&&+p.lat<=82&&+p.lon>=19&&+p.lon<=180;
    const tileUrl=(x,y)=>`https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
    function showStore(p){selected.innerHTML=`<b>Магазин 4 Лапы</b>${escapeHtml([p.city,p.title].filter(Boolean).join(', ')||'Адрес не указан')}`;selected.classList.add('show')}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){const W=map.clientWidth,H=map.clientHeight,q=world(center[1],center[0]),cols=Math.ceil(W/T)+2,rows=Math.ceil(H/T)+2,fx=Math.floor(q[0]/T)-Math.floor(cols/2),fy=Math.floor(q[1]/T)-Math.floor(rows/2);originX=fx;originY=fy;layer.style.width=cols*T+'px';layer.style.height=rows*T+'px';const frag=document.createDocumentFragment();for(let yy=fy;yy<fy+rows;yy++)for(let xx=fx;xx<fx+cols;xx++){const n=2**zoom,key=`${zoom}/${xx}/${yy}`,kx=((xx%n)+n)%n,ky=Math.max(0,Math.min(n-1,yy));let im=cache.get(key);if(!im){im=new Image();im.className='tile';im.loading='lazy';im.decoding='async';im.src=tileUrl(kx,ky);im.onerror=()=>{im.style.opacity='.15'};cache.set(key,im)}im.style.left=(xx-fx)*T+'px';im.style.top=(yy-fy)*T+'px';frag.appendChild(im)}tx=W/2-(q[0]-fx*T);ty=H/2-(q[1]-fy*T);layer.style.transform=`translate3d(${tx}px,${ty}px,0)`;while(layer.firstChild)layer.removeChild(layer.firstChild);layer.appendChild(frag);
      const cell=zoom<8?34:22,groups=new Map();for(const p of points){const a=world(+p.lon,+p.lat),sx=a[0]-fx*T,sy=a[1]-fy*T;if(sx<-35||sy<-35||sx>cols*T+35||sy>rows*T+35)continue;const key=Math.floor(sx/cell)+','+Math.floor(sy/cell);if(!groups.has(key))groups.set(key,[]);groups.get(key).push([sx,sy,p])}const marks=document.createDocumentFragment();for(const group of groups.values()){const sx=group.reduce((n,v)=>n+v[0],0)/group.length,sy=group.reduce((n,v)=>n+v[1],0)/group.length,d=document.createElement('button'),multi=group.length>1;d.type='button';d.className='marker'+(multi?' cluster':'');d.textContent=multi?group.length:'';d.style.left=(sx-(multi?14:10))+'px';d.style.top=(sy-(multi?14:10))+'px';d.title=multi?`${group.length} магазинов`:'Открыть адрес';d.onpointerdown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();if(multi){const worldX=originX*T+sx,worldY=originY*T+sy;center=lngLat(worldX,worldY);zoom=Math.min(18,zoom+1);render()}else showStore(group[0][2])};marks.appendChild(d)}layer.appendChild(marks);count.textContent=`${points.length} магазинов в России`}
    function fit(){if(!points.length)return;const xs=points.map(p=>+p.lon),ys=points.map(p=>+p.lat);center=[(Math.min(...ys)+Math.max(...ys))/2,(Math.min(...xs)+Math.max(...xs))/2];for(let n=8;n>=3;n--){zoom=n;const dx=(Math.max(...xs)-Math.min(...xs))/360*T*2**n,dy=(Math.max(...ys)-Math.min(...ys))/180*T*2**n;if(dx<innerWidth*.78&&dy<innerHeight*.78)break}}
    function move(x,y){if(!drag)return;drag.dx=x-drag.x;drag.dy=y-drag.y;if(raf)return;const activeDrag=drag;raf=requestAnimationFrame(()=>{raf=0;if(!drag||drag!==activeDrag)return;layer.style.transform=`translate3d(${activeDrag.baseTx+activeDrag.dx}px,${activeDrag.baseTy+activeDrag.dy}px,0)`})}
    map.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={x:e.clientX,y:e.clientY,dx:0,dy:0,baseTx:tx,baseTy:ty};map.setPointerCapture?.(e.pointerId);map.style.cursor='grabbing';e.preventDefault()};map.onpointermove=e=>move(e.clientX,e.clientY);map.onpointerup=()=>{if(!drag)return;const q=world(center[1],center[0]);center=lngLat(q[0]-drag.dx,q[1]-drag.dy);drag=null;map.style.cursor='grab';render()};map.onpointercancel=()=>{drag=null;map.style.cursor='grab';render()};map.onwheel=e=>{e.preventDefault();zoom=Math.max(3,Math.min(18,zoom+(e.deltaY<0?1:-1)));render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(18,zoom+1);render()};document.getElementById('minus').onclick=()=>{zoom=Math.max(3,zoom-1);render()};window.addEventListener('resize',render);
    const cached=(()=>{try{return JSON.parse(localStorage.getItem('nutripate-russia-stores')||'[]')}catch(_){return[]}})();if(cached.length){points=cached.filter(isRussia);fit();render()}fetch('store-points.json',{cache:'force-cache'}).then(r=>r.json()).then(x=>{points=(x.stores||[]).filter(isRussia);localStorage.setItem('nutripate-russia-stores',JSON.stringify(points));fit();render()}).catch(()=>{if(!cached.length)count.textContent='Не удалось загрузить магазины'});
  })();
  </script>
</body>
</html>
