<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Магазины 4 Лапы</title>
  <style>
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;font:14px Arial,sans-serif;color:#092f32;background:#eaf5f0}
    #map{position:fixed;inset:0;cursor:grab;touch-action:none;user-select:none}.layer{position:absolute;will-change:transform;pointer-events:none}.tile{position:absolute;width:256px;height:256px;background:#eaf5f0;object-fit:cover}.marker{position:absolute;pointer-events:auto;width:20px;height:20px;border:2px solid #fff;border-radius:50%;background:#13b5b5;box-shadow:0 1px 5px #174c4c88;color:#fff;font-size:9px;font-weight:700;line-height:16px;text-align:center;cursor:pointer}.marker.cluster{width:28px;height:28px;line-height:24px;background:#087f82}.user-location{position:absolute;width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:#2678ff;box-shadow:0 0 0 7px #2678ff33,0 1px 6px #174c4c88;transform:translate(-50%,-50%);z-index:4}.ui{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:5}.ui button,.count,.selected{border:1px solid #dce5de;background:#fff;color:#092f32;box-shadow:0 2px 8px #174c4c33;border-radius:10px}.ui button{width:40px;height:38px;font-size:20px;cursor:pointer}.ui button:disabled{opacity:.55;cursor:wait}.count{padding:11px 13px;font-size:12px}.selected{position:fixed;left:16px;right:16px;bottom:70px;max-width:520px;padding:10px 12px;display:none;z-index:5}.selected.show{display:block}.selected b{display:block;margin-bottom:3px}.selected small{display:block;color:#5f7374;margin-top:4px}.nearby-list{display:grid;gap:5px;margin-top:7px}.nearby-item{display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 8px;border:1px solid #dce5de;border-radius:8px;background:#f8fbfa;color:#092f32;text-align:left;cursor:pointer}.nearby-item strong{white-space:nowrap}.radius-row{display:flex;align-items:center;gap:5px;margin-top:8px}.radius-row span{margin-right:3px;color:#5f7374}.radius-row button{border:1px solid #c9d9d4;border-radius:7px;background:#fff;padding:4px 7px;color:#092f32;cursor:pointer}.radius-row button.active{background:#dff3ee;border-color:#8ecfc0}.credit{position:fixed;right:10px;bottom:8px;z-index:5;padding:3px 5px;background:#fff9;border-radius:5px;font-size:11px}@media(max-width:600px){.ui{left:10px;bottom:max(10px,env(safe-area-inset-bottom));gap:6px}.ui button{width:44px;height:40px}.count{font-size:11px;padding:12px 10px}.credit{font-size:9px;bottom:max(62px,calc(env(safe-area-inset-bottom) + 48px))}.selected{left:10px;right:10px;bottom:62px}}
  </style>
  <style>
    .nearby-item.nearest{border:2px solid #d94b4b;background:#fff1f1;box-shadow:0 2px 8px #d94b4b33}.nearby-item.nearest em{display:block;margin-top:3px;color:#c03939;font-size:11px;font-style:normal;font-weight:700}.nearby-item.nearest strong{color:#c03939}.marker.nearest-marker{background:#df3f3f;border-color:#fff;width:24px;height:24px;line-height:20px;z-index:8;box-shadow:0 0 0 5px #df3f3f33,0 2px 8px #7d1e1e99}.marker.selected-marker{background:#16a085;border-color:#fff;box-shadow:0 0 0 5px #16a08533,0 2px 8px #08705f99;z-index:7}
  </style>
  <style>
    .nearby-panel{padding-top:6px}.nearby-toggle{display:block;position:relative;width:100%;height:22px;padding:0;border:0;background:transparent;color:#7a9693;font-size:0;cursor:pointer}.nearby-toggle::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:#b9cfcc}.nearby-toggle::after{content:"";position:absolute;left:50%;top:6px;width:8px;height:8px;border-right:2px solid #7a9693;border-bottom:2px solid #7a9693;transform:translateX(-50%) rotate(45deg);background:#fff}.nearby-toggle:focus-visible{outline:2px solid #13b5b5;outline-offset:2px}.selected.nearby-collapsed .nearby-toggle::after{top:9px;transform:translateX(-50%) rotate(225deg)}.selected.nearby-collapsed .nearby-list,.selected.nearby-collapsed .radius-row{display:none}.selected.nearby-collapsed{padding-bottom:7px}
  </style>
</head>
<body>
  <div id="map"><div id="layer" class="layer"></div></div>
  <div id="selected" class="selected" role="status"></div>
  <div class="ui"><button id="minus" aria-label="Отдалить">−</button><button id="plus" aria-label="Приблизить">+</button><button id="locate" aria-label="Найти магазины рядом">◎</button><span id="count" class="count">Загрузка магазинов…</span></div>
  <div class="credit">© OpenStreetMap contributors</div>
  <script>
  (()=>{
    const map=document.getElementById('map'),layer=document.getElementById('layer'),selected=document.getElementById('selected'),count=document.getElementById('count'),locateButton=document.getElementById('locate'),T=256;
    let zoom=5,center=[55.75,37.62],points=[],drag=null,raf=0,tx=0,ty=0,originX=0,originY=0,userPosition=null,nearbyRadiusKm=3,selectedStoreId=null,nearbyCollapsed=false;const cache=new Map();
    const world=(lon,lat)=>{const s=T*2**zoom,r=Math.sin(lat*Math.PI/180);return[(lon+180)/360*s,(.5-Math.log((1+r)/(1-r))/(4*Math.PI))*s]};
    const lngLat=(x,y)=>{const s=T*2**zoom,n=Math.PI-2*Math.PI*Math.max(0,Math.min(s,y))/s;return[180/Math.PI*Math.atan(Math.sinh(n)),x/s*360-180]};
    const isRussia=p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lon)&&+p.lat>=41&&+p.lat<=82&&+p.lon>=19&&+p.lon<=180;
    let mapProvider='osm',mapKey='';
    const tileUrl=(x,y)=>mapProvider==='2gis'?`https://tile${(x+y)%5}.maps.2gis.com/v2/tiles/online/${zoom}/${x}/${y}.png?key=${encodeURIComponent(mapKey)}`:mapProvider==='yandex'?`https://tiles.api-maps.yandex.ru/v1/tiles/?x=${x}&y=${y}&z=${zoom}&lang=ru_RU&l=map&apikey=${encodeURIComponent(mapKey)}`:`https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
    async function loadMapProvider(){for(const [name,file] of [['2gis','2gis_maps_api_key.txt'],['yandex','yandex_maps_api_key.txt']]){try{const r=await fetch(file,{cache:'no-store'});const key=(await r.text()).trim();if(r.ok&&key&& !/PASTE_YOUR/i.test(key)){mapProvider=name;mapKey=key;document.querySelector('.credit').textContent=name==='2gis'?'© 2ГИС': '© Яндекс';render();return}}catch(_){}}}
    function allNearbyStores(){if(!userPosition)return[];return points.map(p=>({...p,distanceKm:distanceKm(userPosition,{lat:+p.lat,lon:+p.lon})})).filter(p=>p.distanceKm<=nearbyRadiusKm).sort((a,b)=>a.distanceKm-b.distanceKm)}
    function fitNearbyView(){if(!userPosition)return;const latRadius=nearbyRadiusKm/111.32,lonRadius=nearbyRadiusKm/(111.32*Math.max(.2,Math.cos(userPosition.lat*Math.PI/180)));const project=(lon,lat,z)=>{const s=T*2**z,r=Math.sin(lat*Math.PI/180);return[(lon+180)/360*s,(.5-Math.log((1+r)/(1-r))/(4*Math.PI))*s]};let chosen=12;for(let z=18;z>=3;z--){const a=project(userPosition.lon-lonRadius,userPosition.lat-latRadius,z),b=project(userPosition.lon+lonRadius,userPosition.lat+latRadius,z);if(b[0]-a[0]<=map.clientWidth*.78&&b[1]-a[1]<=map.clientHeight*.72){chosen=z;break}}zoom=chosen;center=[userPosition.lat,userPosition.lon]}
    const showNearbyBase=showNearby;
    showNearby=function(){if(userPosition)fitNearbyView();showNearbyBase();if(!userPosition)return;selected.classList.add('nearby-panel');selected.classList.toggle('nearby-collapsed',nearbyCollapsed);const toggle=document.createElement('button');toggle.type='button';toggle.className='nearby-toggle';toggle.textContent=nearbyCollapsed?'▲':'▼';toggle.setAttribute('aria-label',nearbyCollapsed?'Развернуть список адресов':'Свернуть список адресов');toggle.onclick=e=>{e.stopPropagation();nearbyCollapsed=!nearbyCollapsed;selected.classList.toggle('nearby-collapsed',nearbyCollapsed);toggle.textContent=nearbyCollapsed?'▲':'▼';toggle.setAttribute('aria-label',nearbyCollapsed?'Развернуть список адресов':'Свернуть список адресов')};selected.prepend(toggle)};
    function distanceKm(a,b){const rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad,lat1=a.lat*rad,lat2=b.lat*rad;const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
    function formatDistance(km){return km<1?`${Math.round(km*1000)} м`:`${km.toFixed(1).replace('.',',')} км`}
    function nearestStores(){return allNearbyStores().slice(0,5)}
    function applyMarkerSelection(){document.querySelectorAll('.marker.selected-marker').forEach(x=>x.classList.remove('selected-marker'));if(!selectedStoreId)return;const nearest=nearestStores()[0];if(nearest&&String(nearest.id)===String(selectedStoreId))return;const p=points.find(x=>String(x.id)===String(selectedStoreId));if(!p)return;const a=world(+p.lon,+p.lat),left=a[0]-originX*T,top=a[1]-originY*T;for(const marker of document.querySelectorAll('.marker:not(.nearest-marker)')){if(Math.abs(parseFloat(marker.style.left)+10-left)<3&&Math.abs(parseFloat(marker.style.top)+10-top)<3){marker.classList.add('selected-marker');break}}}
    function showStore(p){selectedStoreId=String(p.id);document.querySelectorAll('.marker.selected-marker').forEach(x=>x.classList.remove('selected-marker'));const active=document.activeElement;if(active&&active.classList.contains('marker')&&!active.classList.contains('nearest-marker'))active.classList.add('selected-marker');else applyMarkerSelection();selected.innerHTML=`<b>Магазин 4 Лапы</b>${escapeHtml([p.city,p.title].filter(Boolean).join(', ')||'Адрес не указан')}`;selected.classList.add('show')}
    function showLocationMessage(message){selected.innerHTML=`<b>Магазины рядом</b><span>${escapeHtml(message)}</span>`;selected.classList.add('show')}
    function showNearby(){if(!userPosition)return;const stores=nearestStores();const radiusButtons=[3,5,10].map(r=>`<button type="button" data-radius="${r}" class="${r===nearbyRadiusKm?'active':''}">${r} км</button>`).join('');const list=stores.length?stores.map((p,i)=>`<button type="button" class="nearby-item${i===0?' nearest':''}" data-store-id="${escapeHtml(p.id)}"><span>${escapeHtml([p.city,p.title].filter(Boolean).join(', ')||'Адрес не указан')}${i===0?'<em>Ближайший магазин</em>':''}</span><strong>${formatDistance(p.distanceKm)}</strong></button>`).join(''):'<small>В выбранном радиусе магазинов не найдено. Увеличьте радиус.</small>';selected.innerHTML=`<b>Ближайшие магазины</b><div class="nearby-list">${list}</div><div class="radius-row"><span>Радиус:</span>${radiusButtons}</div>`;selected.classList.add('show')}
    function locateUser(){if(!navigator.geolocation){showLocationMessage('Геолокация не поддерживается этим браузером.');return}locateButton.disabled=true;showLocationMessage('Определяем ваше местоположение…');navigator.geolocation.getCurrentPosition(pos=>{userPosition={lat:pos.coords.latitude,lon:pos.coords.longitude};center=[userPosition.lat,userPosition.lon];zoom=Math.max(12,Math.min(14,zoom));locateButton.disabled=false;render();showNearby()},err=>{locateButton.disabled=false;const message=err.code===1?'Разрешите доступ к геолокации в настройках браузера.':err.code===2?'Не удалось определить координаты устройства.':'Запрос геолокации занял слишком много времени.';showLocationMessage(message)},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){const W=map.clientWidth,H=map.clientHeight,q=world(center[1],center[0]),cols=Math.ceil(W/T)+2,rows=Math.ceil(H/T)+2,fx=Math.floor(q[0]/T)-Math.floor(cols/2),fy=Math.floor(q[1]/T)-Math.floor(rows/2);originX=fx;originY=fy;layer.style.width=cols*T+'px';layer.style.height=rows*T+'px';const frag=document.createDocumentFragment();for(let yy=fy;yy<fy+rows;yy++)for(let xx=fx;xx<fx+cols;xx++){const n=2**zoom,key=`${zoom}/${xx}/${yy}`,kx=((xx%n)+n)%n,ky=Math.max(0,Math.min(n-1,yy));let im=cache.get(key);if(!im){im=new Image();im.className='tile';im.loading='lazy';im.decoding='async';im.src=tileUrl(kx,ky);im.onerror=()=>{im.style.opacity='.15'};cache.set(key,im)}im.style.left=(xx-fx)*T+'px';im.style.top=(yy-fy)*T+'px';frag.appendChild(im)}tx=W/2-(q[0]-fx*T);ty=H/2-(q[1]-fy*T);layer.style.transform=`translate3d(${tx}px,${ty}px,0)`;while(layer.firstChild)layer.removeChild(layer.firstChild);layer.appendChild(frag);
      const cell=zoom<8?34:22,groups=new Map();for(const p of points){const a=world(+p.lon,+p.lat),sx=a[0]-fx*T,sy=a[1]-fy*T;if(sx<-35||sy<-35||sx>cols*T+35||sy>rows*T+35)continue;const key=Math.floor(sx/cell)+','+Math.floor(sy/cell);if(!groups.has(key))groups.set(key,[]);groups.get(key).push([sx,sy,p])}const marks=document.createDocumentFragment();for(const group of groups.values()){const sx=group.reduce((n,v)=>n+v[0],0)/group.length,sy=group.reduce((n,v)=>n+v[1],0)/group.length,d=document.createElement('button'),multi=group.length>1;d.type='button';d.className='marker'+(multi?' cluster':'');d.textContent=multi?group.length:'';d.style.left=(sx-(multi?14:10))+'px';d.style.top=(sy-(multi?14:10))+'px';d.title=multi?`${group.length} магазинов`:'Открыть адрес';d.onpointerdown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();if(multi){const worldX=originX*T+sx,worldY=originY*T+sy;center=lngLat(worldX,worldY);zoom=Math.min(18,zoom+1);render()}else showStore(group[0][2])};marks.appendChild(d)}layer.appendChild(marks);if(userPosition){const a=world(userPosition.lon,userPosition.lat),u=document.createElement('div');u.className='user-location';u.style.left=(a[0]-fx*T)+'px';u.style.top=(a[1]-fy*T)+'px';u.title='Ваше местоположение';layer.appendChild(u)}count.textContent=`${points.length} магазинов в России`}
    const renderBase=render;
    render=function(){renderBase();const nearest=nearestStores()[0];if(nearest){const a=world(+nearest.lon,+nearest.lat),d=document.createElement('button');d.type='button';d.className='marker nearest-marker';d.title='Ближайший магазин';d.setAttribute('aria-label','Ближайший магазин 4 Лапы');d.style.left=(a[0]-originX*T-12)+'px';d.style.top=(a[1]-originY*T-12)+'px';d.onpointerdown=e=>e.stopPropagation();d.onclick=e=>{e.stopPropagation();showStore(nearest)};layer.appendChild(d)}applyMarkerSelection()}
    function fit(){if(!points.length)return;const xs=points.map(p=>+p.lon),ys=points.map(p=>+p.lat);center=[(Math.min(...ys)+Math.max(...ys))/2,(Math.min(...xs)+Math.max(...xs))/2];for(let n=8;n>=3;n--){zoom=n;const dx=(Math.max(...xs)-Math.min(...xs))/360*T*2**n,dy=(Math.max(...ys)-Math.min(...ys))/180*T*2**n;if(dx<innerWidth*.78&&dy<innerHeight*.78)break}}
    function move(x,y){if(!drag)return;drag.dx=x-drag.x;drag.dy=y-drag.y;if(raf)return;const activeDrag=drag;raf=requestAnimationFrame(()=>{raf=0;if(!drag||drag!==activeDrag)return;layer.style.transform=`translate3d(${activeDrag.baseTx+activeDrag.dx}px,${activeDrag.baseTy+activeDrag.dy}px,0)`})}
    map.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={x:e.clientX,y:e.clientY,dx:0,dy:0,baseTx:tx,baseTy:ty};map.setPointerCapture?.(e.pointerId);map.style.cursor='grabbing';e.preventDefault()};map.onpointermove=e=>move(e.clientX,e.clientY);map.onpointerup=()=>{if(!drag)return;const q=world(center[1],center[0]);center=lngLat(q[0]-drag.dx,q[1]-drag.dy);drag=null;map.style.cursor='grab';render()};map.onpointercancel=()=>{drag=null;map.style.cursor='grab';render()};map.onwheel=e=>{e.preventDefault();zoom=Math.max(3,Math.min(18,zoom+(e.deltaY<0?1:-1)));render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(18,zoom+1);render()};document.getElementById('minus').onclick=()=>{zoom=Math.max(3,zoom-1);render()};window.addEventListener('resize',render);
    const pinchPointers=new Map();let pinchDistance=0;const oldPointerDown=map.onpointerdown,oldPointerMove=map.onpointermove,oldPointerUp=map.onpointerup,oldPointerCancel=map.onpointercancel;const distance=()=>{const a=[...pinchPointers.values()];return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};map.onpointerdown=e=>{if(e.pointerType==='touch'){pinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinchPointers.size>=2){drag=null;pinchDistance=distance();map.releasePointerCapture?.(e.pointerId);e.preventDefault();return}}oldPointerDown(e)};map.onpointermove=e=>{if(e.pointerType==='touch'&&pinchPointers.has(e.pointerId)){pinchPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinchPointers.size>=2){const next=distance();if(pinchDistance&&Math.abs(next-pinchDistance)>18){zoom=Math.max(3,Math.min(18,zoom+(next>pinchDistance?1:-1)));pinchDistance=next;render()}e.preventDefault();return}}oldPointerMove(e)};map.onpointerup=e=>{if(e.pointerType==='touch'){pinchPointers.delete(e.pointerId);if(pinchPointers.size>=1){pinchDistance=distance();e.preventDefault();return}pinchDistance=0}oldPointerUp(e)};map.onpointercancel=e=>{if(e.pointerType==='touch'){pinchPointers.delete(e.pointerId);pinchDistance=distance()}oldPointerCancel(e)};
    selected.onclick=e=>{const radius=e.target.closest('[data-radius]');if(radius){nearbyRadiusKm=Number(radius.dataset.radius);showNearby();return}const store=e.target.closest('[data-store-id]');if(store){const p=points.find(x=>String(x.id)===String(store.dataset.storeId));if(p)showStore(p)}};locateButton.onclick=locateUser;const cached=(()=>{try{return JSON.parse(localStorage.getItem('nutripate-russia-stores')||'[]')}catch(_){return[]}})();if(cached.length){points=cached.filter(isRussia);fit();render()}loadMapProvider();fetch('store-points.json',{cache:'force-cache'}).then(r=>r.json()).then(x=>{points=(x.stores||[]).filter(isRussia);localStorage.setItem('nutripate-russia-stores',JSON.stringify(points));fit();render();if(userPosition)showNearby()}).catch(()=>{if(!cached.length)count.textContent='Не удалось загрузить магазины'});
  })();
  </script>
</body>
</html>
